<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Send As Alias - Use Alias?</title>
  <link rel="stylesheet" href="../theme/tokens.css">
  <link rel="stylesheet" href="prompt.css">
  <script src="../theme/theme.js"></script>
  <script src="../theme/buildBadge.js"></script>
</head>
<body>
  <h2 id="promptHeading">Use an alias for this email?</h2>

  <p>You're composing from:</p>
  <div class="info" id="fromEmail"></div>

  <label for="aliasInput" id="inputLabel">
    Alias name (optional):
  </label>
  <input type="text" id="aliasInput" placeholder="e.g., shopping, work, newsletter">
  <div class="example" id="exampleAlias"></div>

  <div class="checkbox-container">
    <label>
      <input type="checkbox" id="dontAskAgain">
      Don't ask again when using this sender address
    </label>
  </div>

  <div class="buttons">
    <button class="btn-secondary" id="skipBtn">Continue without alias</button>
    <button class="btn-primary" id="useAliasBtn">Use alias</button>
  </div>

  <script src="alias-prompt.js"></script>
</body>
</html>
