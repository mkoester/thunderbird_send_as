<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Send As Alias - Create Identity?</title>
  <link rel="stylesheet" href="../theme/tokens.css">
  <link rel="stylesheet" href="prompt.css">
  <script src="../theme/theme.js"></script>
</head>
<body>
  <h2>Save alias as identity?</h2>

  <p>You're using this alias:</p>
  <div class="info" id="aliasEmail"></div>

  <p>Choose identity name:</p>

  <div class="options-stack">
    <!-- Option 1: Editable -->
    <div class="option-row">
      <div class="option-field">
        <label for="nameOnlyInput">Option 1: Keep original name (editable)</label>
        <input type="text" id="nameOnlyInput">
      </div>
      <button class="btn-primary" id="useNameOnlyBtn">Use this</button>
    </div>

    <!-- Option 2: Read-only -->
    <div class="option-row">
      <div class="option-field">
        <label for="nameWithAliasInput">Option 2: Add alias in name</label>
        <input type="text" id="nameWithAliasInput" readonly>
      </div>
      <button class="btn-secondary" id="useNameWithAliasBtn">Use this</button>
    </div>
  </div>

  <div class="checkbox-container">
    <label>
      <input type="checkbox" id="dontAskAgain">
      Don't ask again for this alias
    </label>
  </div>

  <div class="buttons">
    <button class="btn-secondary" id="skipBtn">Skip</button>
  </div>

  <script src="identity-prompt.js"></script>
</body>
</html>
